<style>

    --mc-azul-escuro: #033A85;
    --mc-verde: #46BE6B;
    --mc-verde-escuro: #37A057;
    --mc-vermelho: #D85736;
    --mc-vermelho-escuro: #B8452A;
    --mc-laranja: #FF914D;

    --mc-teal: #1D5C63;

    background-color: #f4f6f9;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    border-top: 5px solid;
    border-image: linear-gradient(90deg, var(--mc-amarelo), var(--mc-laranja), var(--mc-verde), var(--mc-azul)) 1;
  }
  .card { border-radius: 10px; border: 1px solid #dee2e6; }

  #menuPrincipal {
    display: block;
  }
  #overlayMenu {
    display: none;
  }

      height: 100vh;

      overflow-y: auto;
      transition: left 0.25s ease;

    #menuPrincipal.aberto {

    }
    #overlayMenu {
      display: none;
      position: fixed;

    #overlayMenu.aberto {

  .btn-outline-primary { border-width: 2px; }
  .btn-outline-success { border-width: 2px; }

    min-width: 60px;

  /* Cor primária (azul da SEMED) */
  .btn-primary { background-color: var(--mc-azul) !important; border-color: var(--mc-azul) !important; }
  .btn-primary:hover, .btn-primary:focus { background-color: var(--mc-azul-escuro) !important; border-color: var(--mc-azul-escuro) !important; }
  .btn-outline-primary { color: var(--mc-azul) !important; border-color: var(--mc-azul) !important; }
  .btn-outline-primary:hover { background-color: var(--mc-azul) !important; border-color: var(--mc-azul) !important; }
  .text-primary { color: var(--mc-azul) !important; }
  .border-primary { border-color: var(--mc-azul) !important; }
  a { color: var(--mc-azul); }

  /* Sucesso (verde) */
  .btn-success { background-color: var(--mc-verde) !important; border-color: var(--mc-verde) !important; }
  .btn-success:hover, .btn-success:focus { background-color: var(--mc-verde-escuro) !important; border-color: var(--mc-verde-escuro) !important; }

  .btn-danger:hover, .btn-danger:focus { background-color: var(--mc-vermelho-escuro) !important; border-color: var(--mc-vermelho-escuro) !important; }
  .btn-outline-danger { color: var(--mc-vermelho) !important; border-color: var(--mc-vermelho) !important; }
  .btn-outline-danger:hover { background-color: var(--mc-vermelho) !important; border-color: var(--mc-vermelho) !important; }
  .badge.bg-danger { background-color: var(--mc-vermelho) !important; }

  /* Aviso (laranja) */

  .btn-warning:hover, .btn-warning:focus { background-color: var(--mc-laranja-escuro) !important; border-color: var(--mc-laranja-escuro) !important; }
  .btn-outline-warning { color: var(--mc-laranja-escuro) !important; border-color: var(--mc-laranja) !important; }

  /* Info (tom teal, derivado da janela do carrinho no logo) */

  .btn-outline-info:hover { background-color: var(--mc-teal) !important; border-color: var(--mc-teal) !important; color: #fff !important; }

  /* Cabeçalhos de tabela — tom azul da marca em vez do cinza padrão do Bootstrap */
  .table-dark, .table-dark > :not(caption) > * > * {
    background-color: var(--mc-azul) !important;
    border-color: var(--mc-azul-escuro) !important;
    color: #fff !important;
  }

  .alert-primary { background-color: #E3EDFB !important; border-color: var(--mc-azul) !important; color: var(--mc-azul-escuro) !important; }

  /* Botões gerais — fonte maior, negrito, contorno mais forte */

    font-weight: 700;
    font-size: 0.9rem;
    border-width: 2px;
  }

<script>
  // ============================================================
  // CONEXÃO SUPABASE (via REST API - sem CDN)
  // ============================================================
  const SB_URL = 'https://xzltbjinzlrzfrwdqtxm.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6bHRiamluemxyemZyd2RxdHhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjMxODYsImV4cCI6MjEwNDA5OTE4Nn0.sV9vPOqhyvsyxj9IfIbvpR4_JKYF784an3juELQnDOA';

  let _sbAccessToken = null;

  async function sbAuthRequest(endpoint, body) {
    const url = SB_URL + '/auth/v1/' + endpoint;
    console.log('SB Auth:', url, body);
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify(body)
    });
    const text = await res.text();
    console.log('SB Auth Response:', res.status, text);
    if (!res.ok) {
      let errMsg = text;
      try { errMsg = JSON.parse(text).error_description || JSON.parse(text).error || text; } catch(e) {}
      throw new Error(errMsg);
    }
    return JSON.parse(text);
  }

  function sbHeaders() {
    const h = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + (_sbAccessToken || SB_KEY) };
    return h;
  }

  async function sbRequest(method, path, body) {
    const opts = { method: method, headers: sbHeaders() };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(SB_URL + '/rest/v1/' + path, opts);
    const text = await res.text();
    if (!res.ok) throw new Error(text);
    return text ? JSON.parse(text) : null;
  }

  // AUTH
  async function supabaseLogin(email, senha) {
    const data = await sbAuthRequest('token?grant_type=password', { email: email, password: senha });
    _sbAccessToken = data.access_token;
    return { user: data.user, session: data };
  }

  async function supabaseCadastro(email, senha, metaDados) {
    const data = await sbAuthRequest('signup', { email: email, password: senha, data: metaDados });
    _sbAccessToken = data.access_token;
    return { user: data.user };
  }

  async function supabaseLogout() {
    await sbAuthRequest('logout', {});
    _sbAccessToken = null;
  }

  // PROFILES
  async function buscarPerfil(userId) {
    const data = await sbRequest('GET', 'profiles?id=eq.' + userId + '&select=*');
    return data && data.length > 0 ? data[0] : null;
  }

  async function atualizarPerfil(userId, dados) {
    return await sbRequest('PATCH', 'profiles?id=eq.' + userId, dados);
  }

  async function listarCondutores() {
    return await sbRequest('GET', 'profiles?tipo=eq.condutor&ativo=eq.true&order=nome');
  }

  async function listarUsuarios() {
    return await sbRequest('GET', 'profiles?order=nome');
  }

  // SOLICITACOES
  async function criarSolicitacao(dados) {
    const data = await sbRequest('POST', 'solicitacoes?select=*', dados);
    return data && data.length > 0 ? data[0] : null;
  }

  async function buscarSolicitacoesPorEmail(email) {
    return await sbRequest('GET', 'solicitacoes?email_solicitante=eq.' + encodeURIComponent(email) + '&order=data_solicitacao.desc');
  }

  async function buscarTodasSolicitacoes() {
    return await sbRequest('GET', 'solicitacoes?order=data_solicitacao.desc');
  }

  async function atualizarSolicitacao(id, dados) {
    return await sbRequest('PATCH', 'solicitacoes?id=eq.' + id, dados);
  }

  async function excluirSolicitacao(id) {
    return await sbRequest('DELETE', 'solicitacoes?id=eq.' + id);
  }

  // LOCAIS
  async function listarLocais() {
    return await sbRequest('GET', 'locais?order=nome');
  }

  // TABELAS DE APOIO
  async function listarTabelasApoio() {
    return await sbRequest('GET', 'tabelas_apoio?order=unidade');
  }

  async function listarUnidades() {
    const data = await sbRequest('GET', 'tabelas_apoio?select=unidade&order=unidade');
    return [...new Set(data.map(item => item.unidade))];
  }

  async function listarSetoresPorUnidade(unidade) {
    return await sbRequest('GET', 'tabelas_apoio?unidade=eq.' + encodeURIComponent(unidade) + '&order=setor');
  }

  // NOTIFICACOES
  async function criarNotificacao(dados) {
    const data = await sbRequest('POST', 'notificacoes?select=*', dados);
    return data && data.length > 0 ? data[0] : null;
  }

  async function buscarNotificacoes(email) {
    return await sbRequest('GET', 'notificacoes?email_destinatario=eq.' + encodeURIComponent(email) + '&order=data_hora.desc');
  }

  async function marcarNotificacaoLida(id) {
    return await sbRequest('PATCH', 'notificacoes?id=eq.' + id, { lida: true });
  }

  async function contarNaoLidas(email) {
    const data = await sbRequest('GET', 'notificacoes?email_destinatario=eq.' + encodeURIComponent(email) + '&lida=eq.false&select=id');
    return data ? data.length : 0;
  }

  // KM
  async function registrarKM(dados) {
    const data = await sbRequest('POST', 'registros_km?select=*', dados);
    return data && data.length > 0 ? data[0] : null;
  }

  async function buscarKM_porData(emailCondutor, dataStr) {
    const data = await sbRequest('GET', 'registros_km?email_condutor=eq.' + encodeURIComponent(emailCondutor) + '&data=eq.' + dataStr + '&select=*');
    return data && data.length > 0 ? data[0] : null;
  }

  async function listarTodosKM() {
    return await sbRequest('GET', 'registros_km?order=data.desc');
  }

  async function atualizarKM(id, dados) {
    return await sbRequest('PATCH', 'registros_km?id=eq.' + id, dados);
  }

  async function excluirKM(id) {
    return await sbRequest('DELETE', 'registros_km?id=eq.' + id);
  }

  // ============================================================
  // FIM CONEXÃO SUPABASE
  // ============================================================

  let usuarioAtual = null;
  let cacheTodasSolicitacoes = [];
  let cacheCondutores = [];
  let cacheLocais = [];
  let cacheUnidades = [];
  let cacheRegistrosKmGestor = [];
  let cacheCondutoresKm = [];
  let cacheHistoricoKmCondutor = [];
  let cacheMinhasSolicitacoes = [];
  let cacheAgendaAtual = [];
  let chartKmInstancia = null;
  let chartParetoInstancia = null;
  let chartGestorParetoInstancia = null;
  let chartGestorKmLinhaInstancia = null;
  let chartCondutorKmLinhaInstancia = null;
  let chartGestorDestinosInstancia = null;
  let chartGestorSetoresInstancia = null;
  let chartGestorUnidadesInstancia = null;
  let chartGestorTipoViagemInstancia = null;
  let chartGestorOrigensInstancia = null;
  let chartGestorTimelineInstancia = null;

  // ============================================================
  // TRATAMENTO DE ERRO CENTRAL
  // Toda chamada ao servidor passa por aqui agora. Se o backend
  // der erro, isso aparece na tela em vez de travar em silêncio.
  // ============================================================
  function erroServidor(contexto) {
    return function (erro) {
      console.error('ERRO [' + contexto + ']:', erro);
      alert('Ocorreu um erro em "' + contexto + '":\n' + (erro && erro.message ? erro.message : erro));
    };
  }

  // Cor/rótulo do status - CENTRALIZADO aqui para bater sempre com o backend
  // (Pendente | Em Análise | Confirmada | Cancelada)
  function classeStatus(status) {
    if (status === 'Confirmada') return 'bg-success';
    if (status === 'Cancelada') return 'bg-danger';
    if (status === 'Em Análise') return 'bg-info text-dark';
    if (status === 'Ocupado') return 'bg-secondary';
    if (status === 'Desprezado') return 'bg-dark';
    return 'bg-warning text-dark'; // Pendente
  }

  window.addEventListener('DOMContentLoaded', function() {
    carregarDropdownsApoio();
    restaurarSessao();
  });

  // Guarda o usuário logado (sem senha) para sobreviver a um F5.
  // Some sozinho se a aba for fechada (sessionStorage, não localStorage).
  function salvarSessao() {
    try {
      sessionStorage.setItem('markcarro_usuario', JSON.stringify(usuarioAtual));
    } catch (e) { /* navegador sem suporte, sem problema, só não persiste */ }
  }

  function restaurarSessao() {
    try {
      let salvo = sessionStorage.getItem('markcarro_usuario');
      if (!salvo) return;
      usuarioAtual = JSON.parse(salvo);
      carregarSaudacao();
      carregarPainelPorPerfil();
    } catch (e) {
      sessionStorage.removeItem('markcarro_usuario');
    }
  }

  async function carregarDropdownsApoio() {
    try {
      const [locais, unidades] = await Promise.all([listarLocais(), listarUnidades()]);
      cacheLocais = locais || [];
      cacheUnidades = unidades || [];

      let selUnidade = document.getElementById('cadUnidade');
      let selSetor   = document.getElementById('cadSetor');
      let selOrigem  = document.getElementById('solOrigem');
      let selDestino = document.getElementById('solDestino');

      preencherDropdownUnidades(selUnidade, true);

      selSetor.innerHTML = '<option value="">Selecione o Setor...</option>';
      selSetor.innerHTML += '<option value="Outro">Outro Setor</option>';

      preencherDropdownLocais(selOrigem);
      preencherDropdownLocais(selDestino);
      alternarSetorPorOrigem();
    } catch (erro) {
      erroServidor('carregarDropdownsApoio')(erro);
    }
  }

  function preencherDropdownUnidades(selectElem, comOpcaoOutro) {
    selectElem.innerHTML = '<option value="">Selecione a Unidade...</option>';
    cacheUnidades.forEach(u => selectElem.innerHTML += `<option value="${u}">${u}</option>`);
    if (comOpcaoOutro) selectElem.innerHTML += '<option value="Outro">Outra Unidade</option>';
  }

  // Dropdown de Setor em cascata: chamado quando a Unidade muda
  async function carregarSetoresDaUnidade(selectUnidadeId, selectSetorId) {
    let unidade = document.getElementById(selectUnidadeId).value;
    let selSetor = document.getElementById(selectSetorId);
    if (!unidade || unidade === 'Outro') {
      selSetor.innerHTML = '<option value="">Selecione o Setor...</option><option value="Outro">Outro Setor</option>';
      return;
    }
    try {
      const dados = await listarSetoresPorUnidade(unidade);
      const setores = (dados || []).map(s => s.setor);
      selSetor.innerHTML = '<option value="">Selecione o Setor...</option>';
      setores.forEach(s => selSetor.innerHTML += `<option value="${s}">${s}</option>`);
      selSetor.innerHTML += '<option value="Outro">Outro Setor</option>';
    } catch (erro) {
      erroServidor('carregarSetoresDaUnidade')(erro);
    }
  }

  function preencherDropdownLocais(selectElem, valorAtual) {
    selectElem.innerHTML = '<option value="">Selecione...</option>';
    let achou = false;

    cacheLocais.forEach(loc => {
      let sel = (valorAtual && valorAtual.toLowerCase() === loc.toLowerCase()) ? 'selected' : '';
      if (sel) achou = true;
      selectElem.innerHTML += `<option value="${loc}" ${sel}>${loc}</option>`;
    });

    let selOutro = (valorAtual && !achou) ? 'selected' : '';
    selectElem.innerHTML += `<option value="Outro" ${selOutro}>Outro local</option>`;
  }

  function dataBRparaISO(dataBR) {
    if (!dataBR) return "";
    let partes = dataBR.split("/");

    return dataBR;

  function dataISOparaBR(dataISO) {
    if (!dataISO) return "";
    let partes = dataISO.split("-");
    if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
    return dataISO;
  }

  async function carregarMinhasSolicitacoes() {
    try {
      const lista = await buscarSolicitacoesPorEmail(usuarioAtual.email);

      // ordena por Data Viagem decrescente (mais recente primeiro)
      (lista || []).sort(function(a, b) {
        let da = parseDataBRparaObjeto(a.dataViagem);
        let db = parseDataBRparaObjeto(b.dataViagem);
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return db - da;
      });

      cacheMinhasSolicitacoes = lista || [];
      aplicarFiltrosMinhasSolicitacoes();
    } catch (erro) {
      erroServidor('carregarMinhasSolicitacoes')(erro);
    }
  }

  function aplicarFiltrosMinhasSolicitacoes() {
    let fSolic = document.getElementById('filtroMsDataSolic').value;
    let fViag = document.getElementById('filtroMsDataViagem').value;
    let fHorario = document.getElementById('filtroMsHorario').value;
    let fBusca = document.getElementById('filtroMsOrigemDestino').value.trim().toLowerCase();
    let fStatus = document.getElementById('filtroMsStatus').value;
    let fCondutor = document.getElementById('filtroMsCondutor').value.trim().toLowerCase();

    let fSolicBR = dataISOparaBR(fSolic);
    let fViagBR = dataISOparaBR(fViag);

    let filtradas = cacheMinhasSolicitacoes.filter(item => {
      let bSolic = !fSolicBR || item.dataSolicitacao === fSolicBR;
      let bViag = !fViagBR || item.dataViagem === fViagBR;
      let bHorario = !fHorario || item.horaSaida === fHorario;
      let bBusca = !fBusca || (item.origem + ' ' + item.destino).toLowerCase().includes(fBusca);
      let bStatus = fStatus === 'TODOS' || item.status === fStatus;
      let bCondutor = !fCondutor || (item.condutorIdaCodigo || '').toLowerCase().includes(fCondutor);
      return bSolic && bViag && bHorario && bBusca && bStatus && bCondutor;
    });

    renderizarTabelaMinhasSolicitacoes(filtradas);
  }

  function limparFiltrosMinhasSolicitacoes() {

    document.getElementById('filtroMsOrigemDestino').value = '';
    document.getElementById('filtroMsStatus').value = 'TODOS';
    document.getElementById('filtroMsCondutor').value = '';
    aplicarFiltrosMinhasSolicitacoes();
  }

    let tbody = document.getElementById('tbMinhasSolicitacoes');
    let cardsDiv = document.getElementById('cardsMinhasSolicitacoes');
    tbody.innerHTML = '';
    cardsDiv.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">Nenhuma solicitação encontrada.</td></tr>';
      cardsDiv.innerHTML = '<p class="text-center text-muted py-3">Nenhuma solicitação encontrada.</p>';
      return;
    }

    lista.forEach(item => {
      let condutorHtml;
      let condutorCardHtml;
      if (item.condutorIdaCodigo) {
        let linhaIda = item.condutorIdaCodigo + (item.condutorIdaTelefone ? ' · ' + item.condutorIdaTelefone : '');
        let temVoltaDiferente = item.condutorVoltaEmail && item.condutorVoltaEmail !== item.condutorIdaEmail;
        if (temVoltaDiferente) {
          let linhaVolta = item.condutorVoltaCodigo + (item.condutorVoltaTelefone ? ' · ' + item.condutorVoltaTelefone : '');
          condutorHtml = `<div><small class="text-muted">Ida:</small> ${linhaIda}</div><div><small class="text-muted">Volta:</small> ${linhaVolta}</div>`;
          condutorCardHtml = `<div>🚗 Ida: ${linhaIda}</div><div>🚗 Volta: ${linhaVolta}</div>`;
        } else {
          condutorHtml = linhaIda;
          condutorCardHtml = `🚗 ${linhaIda}`;
        }
      } else {
        condutorHtml = item.condutorIdaEmail ? '<i>Atribuído</i>' : '<i>Pendente</i>';
        condutorCardHtml = item.condutorIdaEmail ? '<i>Atribuído</i>' : '<i>Aguardando condutor</i>';
      }

      tbody.innerHTML += `<tr>
        <td><small>${item.id}</small></td>
        <td>${item.dataSolicitacao}</td>
        <td>${item.dataViagem}</td>
        <td>${item.horaSaida} - ${item.horaRetorno}</td>

            <span class="fw-bold">${item.dataViagem} · ${item.horaSaida}-${item.horaRetorno}</span>

  /** Helper local: converte "dd/mm/yyyy" em objeto Date (ou null se inválido). */
  function parseDataBRparaObjeto(dataBR) {
    if (!dataBR) return null;
    let partes = dataBR.split('/');
    if (partes.length !== 3) return null;
    return new Date(partes[2], partes[1] - 1, partes[0]);
  }

  function renderizarParetoSolicitacoes() {
    if (typeof Chart === 'undefined') {
      document.getElementById('paretoSolicCanvas').parentElement.innerHTML =
        '<p class="text-danger text-center py-4">⚠️ Não foi possível carregar a biblioteca de gráficos (Chart.js). Verifique sua conexão e recarregue a página.</p>';
      return;
    }
    let diasFiltro = Number(document.getElementById('paretoSolicPeriodo').value);
    let hoje = new Date();
    hoje.setHours(23, 59, 59, 999);

    let filtrados = cacheMinhasSolicitacoes.filter(item => {
      if (diasFiltro === 0) return true;
      let d = parseDataBRparaObjeto(item.dataViagem);
      if (!d) return false;
      let diffDias = (hoje - d) / (1000 * 60 * 60 * 24);
      return diffDias >= 0 && diffDias <= diasFiltro;
    });

    let contagem = {};
    filtrados.forEach(item => {
      contagem[item.status] = (contagem[item.status] || 0) + 1;
    });

    // ordena do maior pro menor (clássico Pareto)
    let entradas = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
    let labels = entradas.map(e => e[0]);
    let valores = entradas.map(e => e[1]);
    let total = valores.reduce((s, v) => s + v, 0);

    let acumulado = 0;
    let percentuais = valores.map(v => {
      acumulado += v;
      return total > 0 ? Math.round((acumulado / total) * 100) : 0;
    });

    let ctx = document.getElementById('paretoSolicCanvas').getContext('2d');
    if (chartParetoInstancia) chartParetoInstancia.destroy();
    if (labels.length === 0) return;

    chartParetoInstancia = new Chart(ctx, {
      data: {
        labels: labels,
        datasets: [
          {
            type: 'bar',
            label: 'Quantidade',
            data: valores,
            backgroundColor: '#0d6efd',
            yAxisID: 'yQtd'
          },
          {
            type: 'line',
            label: '% Acumulado',
            data: percentuais,
            borderColor: '#dc3545',
            backgroundColor: '#dc3545',
            yAxisID: 'yPct',
            tension: 0.2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          yQtd: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: 'Quantidade' } },
          yPct: { type: 'linear', position: 'right', beginAtZero: true, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: '% Acumulado' } }
        }
      }
    });
  }

  /** Helper genérico: transforma base64 num download de arquivo no navegador. */
  function baixarArquivoBase64(base64, nomeArquivo) {
    let byteCharacters = atob(base64);
    let byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
    let byteArray = new Uint8Array(byteNumbers);
    let blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = nomeArquivo;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

      try {

        cacheCondutores = (condutores || []).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
        aplicarFiltrosGestor();
      } catch (erro) {
        erroServidor('carregarPainelGestor (condutores)')(erro);
      }
    }

    // Roda em paralelo com a busca de condutores acima, não espera ela terminar
    try {
      const todas = await buscarTodasSolicitacoes();
      cacheTodasSolicitacoes = todas || [];
      aplicarFiltrosGestor();
    } catch (erro) {
      erroServidor('carregarPainelGestor (solicitações)')(erro);
    }
  }

  function aplicarFiltrosGestor() {
    let fSolic = document.getElementById('filtroGestorDataSolic').value;
    let fViag  = document.getElementById('filtroGestorDataViagem').value;
    let fStatus = document.getElementById('filtroGestorStatus').value;

    let fSolicBR = dataISOparaBR(fSolic);
    let fViagBR  = dataISOparaBR(fViag);

    let filtradas = cacheTodasSolicitacoes.filter(item => {
      let bSolic = !fSolicBR || item.dataSolicitacao === fSolicBR;
      let bViag  = !fViagBR  || item.dataViagem === fViagBR;
      let bStatus = (fStatus === 'TODOS') || item.status === fStatus;
      return bSolic && bViag && bStatus;
    });

    filtradas.sort((a, b) => {
      let dA = parseDataBRparaObjeto(a.dataViagem);
      let dB = parseDataBRparaObjeto(b.dataViagem);
      if (!dA && !dB) return 0;
      if (!dA) return 1;
      if (!dB) return -1;
      let diff = dA - dB;
      if (diff !== 0) return diff;
      return (a.horaSaida || '').localeCompare(b.horaSaida || '');
    });

    renderizarTabelaGestor(filtradas);
  }

  function limparFiltrosGestor() {

    document.getElementById('filtroGestorDataViagem').value = '';

    aplicarFiltrosGestor();
  }

  function aplicarMascaraTelefone(input) {
    let v = input.value.replace(/\D/g, "");

    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
    else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
    input.value = v;
  }

  /** Toca um "pim" curto via Web Audio API - sem precisar de nenhum arquivo de áudio. */
  function tocarSomNotificacao() {
    try {
      let ctx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {
      // navegador pode bloquear áudio sem interação prévia do usuário - sem problema, ignora
    }
  }

  async function carregarStatusKm() {
    try {
      let hojeBR = dataISOparaBR(new Date().toISOString().slice(0, 10));
      let ontem = new Date();
      ontem.setDate(ontem.getDate() - 1);
      let ontemBR = dataISOparaBR(ontem.toISOString().slice(0, 10));

      const [registroHoje, registroOntem] = await Promise.all([
        buscarKM_porData(usuarioAtual.email, hojeBR),
        buscarKM_porData(usuarioAtual.email, ontemBR)
      ]);

      let res = { status: 'sem_registro_hoje', registro: null };
      let div = document.getElementById('kmConteudo');

      if (registroOntem && !registroOntem.kmFinal) {
        res.status = 'pendente_dia_anterior';
        res.registro = registroOntem;
      } else if (registroHoje && !registroHoje.kmFinal) {
        res.status = 'aguardando_final';
        res.registro = registroHoje;
      } else if (registroHoje && registroHoje.kmFinal) {
        res.status = 'completo';
        res.registro = registroHoje;
      }

      if (res.status === 'sem_registro_hoje') {
        div.innerHTML = `
          <p>Você ainda não registrou o km inicial de hoje.</p>
          <div class="d-flex gap-2 align-items-end">
            <div>
              <label class="form-label">Km Inicial *</label>
              <input type="number" id="kmInicialInput" class="form-control" min="0">
            </div>
            <button class="btn btn-success" onclick="registrarKmInicialUI()">Registrar Km Inicial</button>
          </div>`;
      } else if (res.status === 'aguardando_final') {
        div.innerHTML = `
          <p>Km inicial de hoje: <strong>${res.registro.kmInicial}</strong>. Falta lançar o km final.</p>
          <div class="d-flex gap-2 align-items-end">
            <div>
              <label class="form-label">Km Final *</label>
              <input type="number" id="kmFinalInput" class="form-control" min="0">
            </div>
            <button class="btn btn-success" onclick="registrarKmFinalUI('${res.registro.data}')">Registrar Km Final</button>
          </div>`;
      } else if (res.status === 'pendente_dia_anterior') {
        div.innerHTML = `
          <div class="alert alert-warning">Você esqueceu de lançar o km final do dia <strong>${res.registro.data}</strong> (km inicial: ${res.registro.kmInicial}). Complete abaixo antes de registrar o de hoje.</div>
          <div class="d-flex gap-2 align-items-end">
            <div>
              <label class="form-label">Km Final de ${res.registro.data} *</label>
              <input type="number" id="kmFinalInput" class="form-control" min="0">
            </div>
            <button class="btn btn-success" onclick="registrarKmFinalUI('${res.registro.data}')">Registrar Km Final</button>
          </div>`;
      } else { // completo
        div.innerHTML = `
          <div class="alert alert-success mb-0">
            Registro de hoje completo: Km Inicial ${res.registro.kmInicial}, Km Final ${res.registro.kmFinal}
            — total rodado: <strong>${res.registro.kmRodado} km</strong>.
          </div>`;
      }
    } catch (erro) {
      erroServidor('carregarStatusKm')(erro);
    }
  }

  async function registrarKmInicialUI() {
    let valor = document.getElementById('kmInicialInput').value;
    if (!valor) { alert('Informe o km inicial.'); return; }

    try {
      let hojeBR = dataISOparaBR(new Date().toISOString().slice(0, 10));
      await registrarKM({
        emailCondutor: usuarioAtual.email,
        condutorCodigo: usuarioAtual.nome,
        data: hojeBR,
        kmInicial: valor
      });
      alert('Km inicial registrado com sucesso!');
      carregarStatusKm();
      carregarHistoricoKm();
    } catch (erro) {
      erroServidor('registrarKmInicial')(erro);
    }
  }

  async function registrarKmFinalUI(dataRegistroBR) {
    let valor = document.getElementById('kmFinalInput').value;
    if (!valor) { alert('Informe o km final.'); return; }

    try {
      const registro = await buscarKM_porData(usuarioAtual.email, dataRegistroBR);
      if (!registro) {
        alert('Registro de KM não encontrado para a data ' + dataRegistroBR);
        return;
      }
      let kmRodado = Number(valor) - Number(registro.kmInicial);
      await atualizarKM(registro.id, {
        kmFinal: valor,
        kmRodado: kmRodado
      });
      alert('Km final registrado com sucesso!');
      carregarStatusKm();
      carregarHistoricoKm();
    } catch (erro) {
      erroServidor('registrarKmFinal')(erro);
    }
  }

  function renderizarTotalKmCondutor() {
    let diasFiltro = Number(document.getElementById('kmCondutorPeriodo').value);
    let hoje = new Date();
    hoje.setHours(23, 59, 59, 999);

    let filtrados = cacheHistoricoKmCondutor.filter(r => {
      if (diasFiltro === 0) return true;
      let partes = (r.data || '').split('/');
      if (partes.length !== 3) return false;
      let dataRegistro = new Date(partes[2], partes[1] - 1, partes[0]);
      let diffDias = (hoje - dataRegistro) / (1000 * 60 * 60 * 24);
      return diffDias >= 0 && diffDias <= diasFiltro;
    });

    let total = filtrados.reduce((soma, r) => soma + Number(r.kmRodado || 0), 0);
    let rotulos = { 1: 'hoje', 7: 'na última semana', 15: 'na última quinzena', 30: 'no último mês', 365: 'no último ano', 0: 'no total' };

    document.getElementById('totalKmCondutor').innerText =
      `${total} km rodados ${rotulos[diasFiltro] || ''} (${filtrados.length} dia(s) registrado(s)).`;
  }

  function renderizarGraficoKmCondutorLinha() {
    let canvas = document.getElementById('kmCondutorCanvas');
    if (!canvas) return;
    if (typeof Chart === 'undefined') {
      canvas.parentElement.innerHTML = '<p class="text-danger text-center py-3">Biblioteca de gráficos não carregada.</p>';
      return;
    }

    let diasFiltro = Number(document.getElementById('kmCondutorPeriodo').value);
    let hoje = new Date();
    hoje.setHours(23, 59, 59, 999);

    let filtrados = (cacheHistoricoKmCondutor || []).filter(r => {
      if (diasFiltro === 0) return true;
      let partes = (r.data || '').split('/');
      if (partes.length !== 3) return false;
      let d = new Date(partes[2], partes[1] - 1, partes[0]);
      let diff = (hoje - d) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= diasFiltro;
    }).sort((a, b) => {
      let pa = a.data.split('/'), pb = b.data.split('/');
      return new Date(pa[2], pa[1]-1, pa[0]) - new Date(pb[2], pb[1]-1, pb[0]);
    });

    let labels = filtrados.map(r => r.data);
    let valores = filtrados.map(r => Number(r.kmRodado || 0));

    if (chartCondutorKmLinhaInstancia) chartCondutorKmLinhaInstancia.destroy();

    if (labels.length === 0) return;

    chartCondutorKmLinhaInstancia = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Km / dia',
          data: valores,
          borderColor: '#044AAA',
          backgroundColor: 'rgba(4,74,170,0.10)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#044AAA'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

    hoje.setHours(23, 59, 59, 999);

    let filtradas = (cacheTodasSolicitacoes || []).filter(item => {
      if (diasFiltro === 0) return true;
      let partes = (item.dataSolicitacao || '').split('/');
      if (partes.length !== 3) return false;
      let d = new Date(partes[2], partes[1] - 1, partes[0]);
      let diff = (hoje - d) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= diasFiltro;
    });

    let contagem = {};
    filtradas.forEach(item => {
      contagem[item.status] = (contagem[item.status] || 0) + 1;
    });

    let entradas = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
    let labels = entradas.map(e => e[0]);
    let valores = entradas.map(e => e[1]);
    let total = valores.reduce((s, v) => s + v, 0);
    let acumulado = 0;
    let percentuais = valores.map(v => { acumulado += v; return total > 0 ? Math.round((acumulado / total) * 100) : 0; });

    if (chartGestorParetoInstancia) chartGestorParetoInstancia.destroy();
    if (labels.length === 0) return;

    chartGestorParetoInstancia = new Chart(canvas.getContext('2d'), {
      data: {
        labels: labels,
        datasets: [
          { type: 'bar', label: 'Quantidade', data: valores, backgroundColor: '#044AAA', yAxisID: 'yQtd' },
          { type: 'line', label: '% Acumulado', data: percentuais, borderColor: '#D85736', backgroundColor: '#D85736', yAxisID: 'yPct', tension: 0.2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          yQtd: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: 'Quantidade' } },
          yPct: { type: 'linear', position: 'right', beginAtZero: true, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: '% Acumulado' } }
        }
      }
    });
  }

  function renderizarGestorKmLinha() {
    let canvas = document.getElementById('gestorKmLinhaCanvas');
    if (!canvas) return;
    if (typeof Chart === 'undefined') {
      canvas.parentElement.innerHTML = '<p class="text-danger text-center py-3">Biblioteca de gráficos não carregada.</p>';
      return;
    }

    let registros = cacheRegistrosKmGestor || [];
    let porCondutor = {};
    registros.forEach(r => {
      if (!r.kmRodado || !r.data) return;
      let nome = r.condutorCodigo || r.emailCondutor || 'Desconhecido';
      if (!porCondutor[nome]) porCondutor[nome] = [];
      porCondutor[nome].push({ data: r.data, km: Number(r.kmRodado) });
    });

    let cores = ['#044AAA','#46BE6B','#D85736','#FF914D','#FFDE59','#8E44AD','#1ABC9C'];
    let datasets = Object.keys(porCondutor).map((nome, i) => {
      let registros = porCondutor[nome].sort((a, b) => {
        let pa = a.data.split('/'), pb = b.data.split('/');
        return new Date(pa[2], pa[1]-1, pa[0]) - new Date(pb[2], pb[1]-1, pb[0]);
      });
      return {
        label: nome,
        data: registros.map(r => r.km),
        borderColor: cores[i % cores.length],
        tension: 0.3,
        pointRadius: 3,
        fill: false
      };
    });

    let todasDatas = [];
    registros.forEach(r => { if (r.data && todasDatas.indexOf(r.data) === -1) todasDatas.push(r.data); });
    todasDatas.sort((a, b) => {
      let pa = a.split('/'), pb = b.split('/');
      return new Date(pa[2], pa[1]-1, pa[0]) - new Date(pb[2], pb[1]-1, pb[0]);
    });

    if (chartGestorKmLinhaInstancia) chartGestorKmLinhaInstancia.destroy();
    if (todasDatas.length === 0) return;

    let datasetsComValores = datasets.map(ds => {
      let mapa = {};
      let nomesDatas = [];
      Object.keys(porCondutor).forEach(nome => {
        if (nomesDatas.length === 0) {
          porCondutor[nome].forEach(r => { if (nomesDatas.indexOf(r.data) === -1) nomesDatas.push(r.data); });
        }
      });
      porCondutor[ds.label].forEach(r => { mapa[r.data] = r.km; });
      return { ...ds, data: todasDatas.map(d => mapa[d] || 0) };
    });

    chartGestorKmLinhaInstancia = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: { labels: todasDatas, datasets: datasetsComValores },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  async function carregarAvisoCnh(containerId) {
    try {
      const lista = await sbRequest('GET', 'profiles?tipo=eq.condutor&ativo=eq.true&select=nome,validade_cnh');
      const hoje = new Date();
      let avisos = [];
      (lista || []).forEach(c => {
        if (!c.validade_cnh) return;
        let partes = c.validade_cnh.split('/');
        if (partes.length !== 3) return;
        let dataCnh = new Date(partes[2], partes[1] - 1, partes[0]);
        let diffDias = Math.ceil((dataCnh - hoje) / (1000 * 60 * 60 * 24));
        if (diffDias <= 30) {
          avisos.push({
            nome: c.nome,
            validadeCnh: c.validade_cnh,
            diasRestantes: diffDias,
            vencida: diffDias < 0
          });
        }
      });

      let div = document.getElementById(containerId);
      if (avisos.length === 0) { div.innerHTML = ''; return; }

      let itens = avisos.map(c => {
        let texto = c.vencida
          ? `<strong>${c.nome}</strong>: CNH venceu em ${c.validadeCnh} (${Math.abs(c.diasRestantes)} dias atrás)`
          : `<strong>${c.nome}</strong>: CNH vence em ${c.validadeCnh} (em ${c.diasRestantes} dia(s))`;
        return `<li>${texto}</li>`;
      }).join('');

      div.innerHTML = `<div class="alert alert-warning mb-3">
        <strong>⚠️ Atenção — CNH vencida ou próxima do vencimento:</strong>
        <ul class="mb-0 mt-1">${itens}</ul>
      </div>`;
    } catch (erro) {
      erroServidor('buscarAvisosCnh')(erro);
    }
  }

    try {
      const perfil = await sbRequest('GET', 'profiles?email=eq.' + encodeURIComponent(email) + '&select=id');
      if (!perfil || perfil.length === 0) { alert('Usuário não encontrado.'); return; }
      await atualizarPerfil(perfil[0].id, { ativo: ativar });
      alert('Condutor ' + (ativar ? 'liberado' : 'bloqueado') + ' com sucesso!');
      carregarListaCondutoresGestor();

      erroServidor('alternarAtivoUsuario')(erro);

      let csv = 'Nome,Email,Telefone,Categoria,Placa,Modelo,Capacidade,CNH,Validade CNH,Ativo\n';
      lista.forEach(c => {
        csv += `"${c.nome}","${c.email}","${c.telefone || ''}","${c.categoria || ''}","${c.placa || ''}","${c.modelo || ''}","${c.capacidade || ''}","${c.cnh || ''}","${c.validade_cnh || ''}","${c.ativo ? 'Sim' : 'Não'}"\n`;
      });
      let blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });

          <td>${r.kmFinal || '-'}</td>

          <td>${r.ajustado === 'Sim' ? '✓' : ''}</td>
          <td><button class="btn btn-sm btn-outline-primary" onclick='editarKmGestor(decodeURIComponent("${dadosJson}"))'>Editar</button></td>
        </tr>`;
      });
    } catch (erro) {
      erroServidor('listarTodosRegistrosKm')(erro);
    }
  }

  function renderizarGraficoKm() {
    if (typeof Chart === 'undefined') {
      document.getElementById('graficoKmCanvas').parentElement.innerHTML =
        '<p class="text-danger text-center py-4">⚠️ Não foi possível carregar a biblioteca de gráficos (Chart.js). Verifique sua conexão e recarregue a página.</p>';
      return;
    }
    let diasFiltro = Number(document.getElementById('kmGraficoPeriodo').value);
    let categoriaFiltro = document.getElementById('kmGraficoCategoria').value;
    let hoje = new Date();
    hoje.setHours(23, 59, 59, 999); // inclui o dia de hoje inteiro

    let emailsPorCategoria = {};
    cacheCondutoresKm.forEach(c => { emailsPorCategoria[c.email.toLowerCase()] = c.categoria; });

    let registrosFiltrados = cacheRegistrosKmGestor.filter(r => {
      if (!r.kmRodado) return false;

      if (categoriaFiltro) {
        let cat = emailsPorCategoria[(r.emailCondutor || '').toLowerCase()];
        if (cat !== categoriaFiltro) return false;
      }

      if (diasFiltro === 0) return true;
      let partes = (r.data || '').split('/');
      if (partes.length !== 3) return false;
      let dataRegistro = new Date(partes[2], partes[1] - 1, partes[0]);
      let diffDias = (hoje - dataRegistro) / (1000 * 60 * 60 * 24);
      return diffDias >= 0 && diffDias <= diasFiltro;
    });

    let totais = {};
    registrosFiltrados.forEach(r => {
      totais[r.condutorCodigo] = (totais[r.condutorCodigo] || 0) + Number(r.kmRodado);
    });

    let labels = Object.keys(totais);
    let valores = labels.map(l => totais[l]);

    let ctx = document.getElementById('graficoKmCanvas').getContext('2d');
    if (chartKmInstancia) chartKmInstancia.destroy();

    if (labels.length === 0) return;

    chartKmInstancia = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{ label: 'Km Rodado', data: valores, backgroundColor: '#0d6efd' }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  function editarKmGestor(dadosStr) {
    let r = JSON.parse(dadosStr);
    document.getElementById('kmGestorCondutor').value = r.email_condutor || r.emailCondutor;
    document.getElementById('kmGestorData').value = dataBRparaISO(r.data);
    document.getElementById('kmGestorInicial').value = r.kmInicial;
    document.getElementById('kmGestorFinal').value = r.kmFinal || '';
    window.scrollTo(0, 0);
  }

  async function salvarKmGestor() {
    let dados = {
      emailCondutor: document.getElementById('kmGestorCondutor').value,
      dataBR: dataISOparaBR(document.getElementById('kmGestorData').value),
      kmInicial: document.getElementById('kmGestorInicial').value,
      kmFinal: document.getElementById('kmGestorFinal').value
    };

    if (!dados.emailCondutor || !dados.dataBR || dados.kmInicial === '') {
      alert('Preencha Condutor, Data e Km Inicial.');
      return;
    }

    try {
      const existente = await buscarKM_porData(dados.emailCondutor, dados.dataBR);
      let kmRodado = dados.kmFinal ? Number(dados.kmFinal) - Number(dados.kmInicial) : null;

      if (existente) {
        await atualizarKM(existente.id, {
          kmInicial: dados.kmInicial,
          kmFinal: dados.kmFinal || null,
          kmRodado: kmRodado
        });
      } else {
        const condutor = cacheCondutoresKm.find(c => c.email === dados.emailCondutor);
        await registrarKM({
          emailCondutor: dados.emailCondutor,
          condutorCodigo: condutor ? condutor.codigo : dados.emailCondutor,
          data: dados.dataBR,
          kmInicial: dados.kmInicial,
          kmFinal: dados.kmFinal || null,
          kmRodado: kmRodado
        });
      }
      alert('Registro de KM salvo com sucesso!');
      document.getElementById('formKmGestor').reset();
      carregarListaKmGestor();
    } catch (erro) {
      erroServidor('salvarKmGestor')(erro);
    }
  }

  /**
   * ALTERAR MINHA SENHA (todos os perfis)
   */
  function abrirAlterarSenha() {
    ocultarTodasTelas();
    document.getElementById('senhaAtualInput').value = '';
    document.getElementById('senhaNovaInput').value = '';
    document.getElementById('senhaNovaConfirmInput').value = '';
    document.getElementById('telaAlterarSenha').removeAttribute('hidden');
  }

  function voltarDaAlterarSenha() {
    ocultarTodasTelas();
    // volta pro painel/tela correta de acordo com o perfil logado
    carregarPainelPorPerfil();
  }

  async function salvarNovaSenha() {
    let atual = document.getElementById('senhaAtualInput').value;
    let nova = document.getElementById('senhaNovaInput').value;
    let confirmar = document.getElementById('senhaNovaConfirmInput').value;

    if (!atual || !nova || !confirmar) {
      alert('Preencha todos os campos.');
      return;
    }
    if (nova !== confirmar) {
      alert('A nova senha e a confirmação não são iguais.');
      return;
    }

    try {
      await sbAuthRequest('user', { password: nova });
      alert('Senha alterada com sucesso!');
      voltarDaAlterarSenha();
    } catch (erro) {
      erroServidor('alterarMinhaSenha')(erro);
    }
  }

  /**
   * GERENCIAR USUÁRIOS / SOLICITANTES (gestor)
   */
  function abrirGerenciarUsuarios() {
    ocultarTodasTelas();
    document.getElementById('telaGerenciarUsuarios').classList.remove('d-none');
    limparFormUsuario();
    carregarListaUsuariosGestor();
  }

  async function carregarListaUsuariosGestor() {
    try {
      const lista = await listarUsuarios();
      let tbody = document.getElementById('tbUsuarios');
      tbody.innerHTML = '';
      if (!lista || lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhum usuário cadastrado ainda.</td></tr>';
        return;
      }
      lista.forEach(u => {
        let dadosJson = encodeURIComponent(JSON.stringify(u));
        tbody.innerHTML += `<tr class="${u.ativo ? '' : 'table-secondary'}">
          <td>${u.nome}</td>
          <td><small>${u.email}</small></td>
          <td>${u.telefone || '-'}</td>
          <td>${u.unidade || '-'}</td>
          <td>${u.setor || '-'}</td>
          <td><span class="badge ${u.ativo ? 'bg-success' : 'bg-secondary'}">${u.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick='editarUsuario(decodeURIComponent("${dadosJson}"))'>Editar</button>
            <button class="btn btn-sm ${u.ativo ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="alternarAtivoUsuarioUI('${u.email}', ${!u.ativo})">${u.ativo ? 'Bloquear' : 'Liberar'}</button>
          </td>
        </tr>`;
      });
    } catch (erro) {
      erroServidor('listarSolicitantesCompleto')(erro);
    }
  }

  async function editarUsuario(dadosStr) {
    let u = JSON.parse(dadosStr);
    document.getElementById('usrEmailOriginal').value = u.email;
    document.getElementById('usrNome').value = u.nome || '';
    document.getElementById('usrEmail').value = u.email || '';
    document.getElementById('usrEmail').readOnly = true;
    document.getElementById('usrSenha').value = '';
    document.getElementById('usrTelefone').value = u.telefone || '';
    preencherDropdownUnidades(document.getElementById('usrUnidade'), false);
    document.getElementById('usrUnidade').value = u.unidade || '';
    try {
      const dados = await listarSetoresPorUnidade(u.unidade);
      const setores = (dados || []).map(s => s.setor);
      let selSetor = document.getElementById('usrSetor');
      selSetor.innerHTML = '<option value="">Selecione o Setor...</option>';
      setores.forEach(s => selSetor.innerHTML += `<option value="${s}">${s}</option>`);
      selSetor.value = u.setor || '';
    } catch (erro) {
      erroServidor('buscarSetoresPorUnidade (edição)')(erro);
    }
    document.getElementById('tituloFormUsuario').innerText = 'Editando: ' + u.nome;
    document.getElementById('btnCancelarEdicaoUsuario').classList.remove('d-none');
    window.scrollTo(0, 0);
  }

  function limparFormUsuario() {
    document.getElementById('formUsuario').reset();
    document.getElementById('usrEmailOriginal').value = '';
    document.getElementById('usrEmail').readOnly = false;
    preencherDropdownUnidades(document.getElementById('usrUnidade'), false);
    document.getElementById('usrSetor').innerHTML = '<option value="">Selecione o Setor...</option>';
    document.getElementById('tituloFormUsuario').innerText = 'Novo Usuário';
    document.getElementById('btnCancelarEdicaoUsuario').classList.add('d-none');
  }

  async function alternarAtivoUsuarioUI(email, ativar) {
    let acao = ativar ? 'liberar o acesso' : 'bloquear o acesso';
    if (!confirm(`Tem certeza que deseja ${acao} deste usuário?`)) return;

    try {
      const perfil = await sbRequest('GET', 'profiles?email=eq.' + encodeURIComponent(email) + '&select=id');
      if (!perfil || perfil.length === 0) { alert('Usuário não encontrado.'); return; }
      await atualizarPerfil(perfil[0].id, { ativo: ativar });
      alert('Usuário ' + (ativar ? 'liberado' : 'bloqueado') + ' com sucesso!');
      carregarListaUsuariosGestor();
    } catch (erro) {
      erroServidor('alternarAtivoUsuario')(erro);
    }
  }

  async function salvarUsuarioGestor() {
    let dados = {
      email: document.getElementById('usrEmail').value,
      nome: document.getElementById('usrNome').value,
      telefone: document.getElementById('usrTelefone').value,
      unidade: document.getElementById('usrUnidade').value,
      setor: document.getElementById('usrSetor').value
    };

    if (!dados.nome || !dados.email || !dados.unidade || !dados.setor) {
      alert('Nome, e-mail, Unidade e Setor são obrigatórios.');
      return;
    }

    try {
      const perfil = await sbRequest('GET', 'profiles?email=eq.' + encodeURIComponent(dados.email) + '&select=id');
      if (perfil && perfil.length > 0) {
        await atualizarPerfil(perfil[0].id, dados);
        alert('Usuário atualizado com sucesso!');
      } else {
        alert('Usuário não encontrado. Crie o usuário primeiro no painel do Supabase.');
        return;
      }
      limparFormUsuario();
      carregarListaUsuariosGestor();
    } catch (erro) {
      erroServidor('salvarUsuarioGestor')(erro);
    }
  }
</script>
